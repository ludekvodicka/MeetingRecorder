name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # PyQt6 needs these to import at all on a headless runner, and PortAudio backs
      # sounddevice. Without them the whole suite fails at collection time.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libportaudio2 libsndfile1 xclip \
            libpulse0

      - run: pip install -e ".[dev]"

      - run: ruff check .

      - name: Run tests
        run: pytest
        env:
          # There is no display, and the tests that touch Qt only need it to construct.
          QT_QPA_PLATFORM: offscreen

      # The generated table is identical on every platform by construction, so all three
      # runners check it and a machine-specific slip cannot pass unnoticed.
      - name: Check the third-party inventory
        run: python scripts/generate_third_party.py --check

      - name: Check the version is well formed
        run: python scripts/check_release_version.py

  # Runs after a push has landed, so it cannot prevent a leak: a pushed secret is already
  # exposed and has to be rotated. It exists to stop a contributor pull request that
  # carries a secret from reaching main. The maintainer's own gate is the pre-push hook.
  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so the scan covers every commit and not just the diff
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

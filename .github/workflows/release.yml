name: Release build

on:
  push:
    tags:
      - "v*"
  # Build all three platforms without tagging or releasing anything, to prove the
  # packaging still works before a real release is cut.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libportaudio2 libsndfile1 xclip \
            libpulse0

      - name: Install appimagetool
        if: runner.os == 'Linux'
        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          APPIMAGE_RUNTIME_VERSION: "20251108"
          APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          tool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          runtime="$RUNNER_TEMP/runtime-x86_64"
          curl -fsSL --retry 3 -o "$tool" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          curl -fsSL --retry 3 -o "$runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-x86_64"
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" "$tool" | sha256sum --check --strict
          printf '%s  %s\n' "$APPIMAGE_RUNTIME_SHA256" "$runtime" | sha256sum --check --strict
          chmod +x "$tool"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME_FILE=$runtime" >> "$GITHUB_ENV"
          # The runner has no FUSE, so the tool has to unpack itself instead of mounting.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - run: pip install -e ".[dev]"

      # Before anything is built, so a mistyped tag fails in seconds and not in minutes.
      - name: Validate the version against the tag
        run: python scripts/check_release_version.py

      - name: Check the source
        run: |
          ruff check .
          pytest
          python scripts/generate_third_party.py --check
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package for ${{ matrix.platform }}
        run: python scripts/build.py package
        env:
          QT_QPA_PLATFORM: offscreen
          # Fork workflows must not produce packages that replace themselves with upstream.
          MEETING_RECORDER_BUILD_CHANNEL: ${{ github.repository == 'ludekvodicka/MeetingRecorder' && 'official' || 'custom' }}

      # The new build is the program that installs itself, so the real artifact has to swap
      # a scratch copy in helper mode before it is released. macOS builds do not self-install.
      - name: Prove the update helper on the packaged build
        if: runner.os != 'macOS'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) built=(release/Meeting-Recorder-*-x64.exe) ;;
            Linux) built=(release/Meeting-Recorder-*-x86_64.AppImage) ;;
            *) echo "unexpected runner $RUNNER_OS"; exit 1 ;;
          esac
          test "${#built[@]}" -eq 1 && test -f "${built[0]}"
          python -m audiorecorder.shared.desktop.autoupdate.verify file "${built[0]}" --scratch "$RUNNER_TEMP"

      - name: Upload the artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meeting-recorder-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  release:
    name: create the draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download every platform's artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Compute the checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \
            -o -name '*.AppImage' -o -name '*.tar.gz' \) | sort | while read -r file; do
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$(basename "$file")"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # actions/checkout does not keep annotated tag objects, so the tag is fetched again to
      # read the summary that release.sh wrote into it.
      - name: Read the release summary from the annotated tag
        run: |
          git fetch --depth=1 --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" \
            | sed "1s/^${GITHUB_REF_NAME} - //" > summary.md
          test -s summary.md
          cat summary.md

      # The application shows the notes up to the marker; the download check below stays on
      # the release page.
      - name: Write the release notes
        run: |
          {
            cat summary.md
            echo
            echo '<!-- update-notes-end -->'
            echo
            echo '### Verify your download'
            echo
            echo 'These builds are unsigned. Check the SHA256 of your download before running it.'
            echo
            echo '```'
            cat artifacts/SHA256SUMS.txt
            echo '```'
            echo
            echo 'Windows SmartScreen and macOS Gatekeeper will warn about an unknown publisher.'
            echo 'The Windows .exe (also from the portable zip) and the Linux AppImage install newer releases'
            echo 'themselves after checking them against SHA256SUMS.txt. macOS and the Linux .tar.gz show new'
            echo 'releases with a link to this page.'
            echo
            echo 'See the README for what works on which platform.'
          } > release-notes.md

      - name: Create the draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          body_path: release-notes.md
          files: artifacts/**/*

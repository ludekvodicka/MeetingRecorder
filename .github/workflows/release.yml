name: Release build

on:
  push:
    tags:
      - "v*"
  # Build all three platforms without tagging or releasing anything, to prove the
  # packaging still works before a real release is cut.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libportaudio2 libsndfile1 xclip \
            libpulse0

      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
          # The runner has no FUSE, so the tool has to unpack itself instead of mounting.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - run: pip install -e ".[dev]"

      # Before anything is built, so a mistyped tag fails in seconds and not in minutes.
      - name: Validate the version against the tag
        run: python scripts/check_release_version.py

      - name: Check the source
        run: |
          ruff check .
          pytest
          python scripts/generate_third_party.py --check
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package for ${{ matrix.platform }}
        run: python scripts/build.py package
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload the artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audio-recorder-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  release:
    name: create the draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download every platform's artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Compute the checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \
            -o -name '*.AppImage' -o -name '*.tar.gz' \) | sort | while read -r file; do
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$(basename "$file")"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write the release notes
        run: |
          {
            echo '### Verify your download'
            echo
            echo 'These builds are unsigned. Check the SHA256 of your download before running it.'
            echo
            echo '```'
            cat artifacts/SHA256SUMS.txt
            echo '```'
            echo
            echo 'Windows SmartScreen and macOS Gatekeeper will warn about an unknown publisher.'
            echo 'The application does not update itself; it only tells you when a newer release exists.'
            echo
            echo 'See the README for what works on which platform.'
          } > release-notes.md

      - name: Create the draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          body_path: release-notes.md
          files: artifacts/**/*
